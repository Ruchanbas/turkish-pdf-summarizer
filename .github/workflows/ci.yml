name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint & type check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - name: ruff check
        run: ruff check .
      - name: ruff format
        run: ruff format --check .
      - name: mypy (strict)
        run: mypy

  test:
    name: Tests (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: pip install -e ".[dev]"
      - name: pytest
        run: pytest --cov --cov-report=term-missing

  model-code:
    name: Model code (tiny local model)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: CPU-only torch
        run: pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: pip install -e ".[dev,models]"
      # Ağ gerektirmez: model testte sıfırdan oluşturulur.
      - name: pytest (tiny model + model layer)
        run: pytest tests/test_models_tiny.py tests/test_models.py -v

  e2e:
    name: Frontend end-to-end (Playwright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]" playwright
      - run: python -m playwright install --with-deps chromium
      - name: pytest (gerçek tarayıcı, local API, sahte model)
        run: pytest tests/e2e -v

  infra:
    name: Terraform (fmt + validate)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~1.10"
      - run: terraform fmt -check -recursive -diff infra
      - name: validate (uygulama)
        run: terraform -chdir=infra init -backend=false -input=false && terraform -chdir=infra validate
      - name: validate (bootstrap)
        run: terraform -chdir=infra/bootstrap init -backend=false -input=false && terraform -chdir=infra/bootstrap validate

  packaging:
    name: Packaging (API zip, Docker images)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: scripts/build_api_zip.sh dist/api.zip
      - name: API paketi kendi başına içe aktarılır, ağır bağımlılık yok
        run: |
          cd "$(mktemp -d)" && unzip -q "$GITHUB_WORKSPACE/dist/api.zip"
          python -I -c "
          import sys; sys.path.insert(0, '.')
          import ozetle.service.lambda_api
          heavy = {'pdfplumber', 'torch', 'transformers'} & set(sys.modules)
          assert not heavy, heavy
          print('API paketi tamam')"
      - uses: docker/setup-buildx-action@v3
      - name: Worker imajı (modelsiz derleme)
        run: |
          docker buildx build --platform linux/amd64 --provenance=false -f Dockerfile.worker \
            --build-arg DOWNLOAD_MODELS=0 -t ozetle-worker:ci --load .
          docker run --rm --entrypoint python ozetle-worker:ci -c \
            "import ozetle.service.lambda_worker as w; print('handler:', w.handler.__name__)"
      - name: Local imaj ayağa kalkar ve arayüzü sunar
        run: |
          docker buildx build -t ozetle:ci --load .
          docker run -d --name ozetle -p 8000:8000 -e OZETLE_MODEL=lead ozetle:ci
          for i in $(seq 1 30); do curl -fsS localhost:8000/api/health && break; sleep 2; done
          curl -fsS localhost:8000/ | grep -q "ozetle"
          docker logs ozetle | tail -5
