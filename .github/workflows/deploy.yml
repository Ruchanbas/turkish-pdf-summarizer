name: Deploy

# AWS'ye dağıtım. Statik anahtar yok: GitHub'ın OIDC jetonu, infra/bootstrap'in
# oluşturduğu rolü yalnızca main dalından üstlenebilir.
#
# Gerekli depo değişkenleri (Settings → Secrets and variables → Actions → Variables):
#   AWS_ROLE_ARN     bootstrap çıktısı deploy_role_arn
#   TF_STATE_BUCKET  bootstrap çıktısı state_bucket
# İsteğe bağlı: AWS_REGION (eu-central-1), OZETLE_MODEL (mt5-small),
#   WORKER_MEMORY_MB (3008), ALERT_EMAIL
#
# AWS_ROLE_ARN tanımlı değilse iş atlanır; depo AWS'siz de yeşil kalır.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - src/**
      - frontend/**
      - infra/*.tf
      - Dockerfile.worker
      - scripts/build_api_zip.sh
      - pyproject.toml
      - .github/workflows/deploy.yml

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

env:
  AWS_REGION: ${{ vars.AWS_REGION || 'eu-central-1' }}
  MODEL: ${{ vars.OZETLE_MODEL || 'mt5-small' }}
  TF_IN_AUTOMATION: "1"

jobs:
  deploy:
    if: vars.AWS_ROLE_ARN != ''
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~1.10"
          terraform_wrapper: false

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: API paketi
        run: scripts/build_api_zip.sh dist/api.zip

      - name: terraform init
        working-directory: infra
        run: |
          terraform init -input=false \
            -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" \
            -backend-config="region=${AWS_REGION}"

      - name: Terraform değişkenleri
        run: |
          {
            echo "TF_VAR_region=${AWS_REGION}"
            echo "TF_VAR_model=${MODEL}"
            echo "TF_VAR_worker_image_tag=${GITHUB_SHA}"
            echo "TF_VAR_api_zip_path=${GITHUB_WORKSPACE}/dist/api.zip"
            echo "TF_VAR_alert_email=${{ vars.ALERT_EMAIL }}"
            echo "TF_VAR_worker_memory_mb=${{ vars.WORKER_MEMORY_MB || '3008' }}"
          } >> "$GITHUB_ENV"

      # İlk kurulumda imajı itebilmek için önce depo olmalı.
      - name: ECR deposu
        working-directory: infra
        run: terraform apply -input=false -auto-approve -target=aws_ecr_repository.worker -target=aws_ecr_lifecycle_policy.worker

      - id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - uses: docker/setup-buildx-action@v3

      - name: Worker imajı (model içinde)
        run: |
          repo="$(terraform -chdir=infra output -raw ecr_repository_url)"
          if aws ecr describe-images --repository-name "${repo##*/}" --image-ids imageTag="$GITHUB_SHA" >/dev/null 2>&1; then
            echo "İmaj zaten var: $GITHUB_SHA"
          else
            docker buildx build --platform linux/amd64 --provenance=false \
              -f Dockerfile.worker --build-arg MODEL="$MODEL" \
              -t "$repo:$GITHUB_SHA" --push .
          fi

      - name: terraform apply
        working-directory: infra
        run: terraform apply -input=false -auto-approve

      - name: Arayüz
        run: |
          bucket="$(terraform -chdir=infra output -raw site_bucket)"
          dist="$(terraform -chdir=infra output -raw distribution_id)"
          aws s3 sync frontend/ "s3://$bucket/" --delete --cache-control "public, max-age=300"
          aws cloudfront create-invalidation --distribution-id "$dist" --paths "/*" >/dev/null

      - name: Duman testi
        run: |
          url="$(terraform -chdir=infra output -raw site_url)"
          for i in $(seq 1 30); do
            if curl -fsS "$url/api/health"; then echo; echo "Canlı: $url" >> "$GITHUB_STEP_SUMMARY"; exit 0; fi
            sleep 10
          done
          echo "Sağlık kontrolü başarısız: $url/api/health"; exit 1
