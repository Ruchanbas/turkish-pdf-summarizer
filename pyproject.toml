[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ozetle"
version = "0.1.0"
description = "Türkçe PDF özetleme servisi — chunked inference, async job queue, AWS serverless"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Rüçhan Baş" }]
requires-python = ">=3.11"
dependencies = [
    "pdfplumber>=0.11",   # MIT. PyMuPDF daha hızlı ama AGPL — repo lisansını
]                         # kirletmemesi için tercih edilmedi.

[project.optional-dependencies]
models = [
    "torch>=2.2",
    "transformers>=4.44",
    "sentencepiece>=0.2",
    "protobuf>=4.25",     # mT5 tokenizer dönüşümü için
    "keybert>=0.8",
    "sentence-transformers>=3.0",
    "scikit-learn>=1.4",
]
service = [
    "pydantic-settings>=2.2",
    "boto3>=1.34",
]
api = [
    "ozetle[service]",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "python-multipart>=0.0.9",
    "mangum>=0.17",
]
worker = ["ozetle[service,models]"]
bench = [
    "ozetle[models]",
    "datasets>=2.19",
    "rouge-score>=0.1.2",
    "bert-score>=0.3.13",
]
dev = [
    "ozetle[api]",
    "httpx>=0.27",
    "moto[dynamodb,s3]>=5.0",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "reportlab>=4.0",     # yalnızca test fixture'ları için PDF üretir
    "ruff>=0.6",
    "mypy>=1.10",
]

[project.scripts]
ozetle = "ozetle.__main__:main"
ozetle-serve = "ozetle.service.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/ozetle"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests", "src"]
addopts = "-q --strict-markers --doctest-modules -m 'not model'"
markers = [
    "model: gerçek Hugging Face modellerini indirir (yavaş; CI'da models.yml)",
]

[tool.coverage.run]
source = ["ozetle"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 90

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF"]
# RUF001-003 Türkçe metni "homoglif saldırısı" sanıyor (ı ≈ i) ve binlerce
# sahte hata üretiyor. Kuralı kapatmak yerine yalnızca Türk alfabesi beyaz
# listeye alınır: Kiril "а" gibi gerçek benzerler hâlâ yakalanır.
allowed-confusables = ["ç", "ğ", "ı", "İ", "ö", "ş", "ü", "Ç", "Ğ", "Ö", "Ş", "Ü"]

[tool.ruff.lint.isort]
known-first-party = ["ozetle"]

[tool.ruff.lint.per-file-ignores]
# Test sınıf ve fonksiyon adları Türkçe; pytest fixture'ları argüman olarak gelir.
"tests/**" = ["N802"]

[tool.mypy]
strict = true
files = ["src"]

[[tool.mypy.overrides]]
# Ağır ML kütüphaneleri yalnızca fonksiyon içinde, tembel içe aktarılır.
module = [
    "torch", "torch.*", "transformers", "transformers.*", "keybert", "keybert.*",
    "sklearn", "sklearn.*", "boto3", "boto3.*", "botocore", "botocore.*",
    "huggingface_hub", "huggingface_hub.*",
]
ignore_missing_imports = true
